id: docker-playground
title: Docker Fundamentals Sandbox
practical: Practical 3.2
module: CI/CD Automation using Jenkins & Docker
summary: An isolated Docker engine inside a container. Build images, write Dockerfiles and run compose stacks without touching your own Docker installation.
tags: [docker, dockerfile, compose, containers, lo3]
version: 1.0.0
estimateMb: 900

services:
  - id: docker
    name: Docker Sandbox
    kind: terminal
    image: docker:27-dind
    description: A full Docker engine plus CLI and compose, in its own sandbox.
    estimateMb: 800
    privileged: true
    shell: [/bin/sh]
    env:
      DOCKER_TLS_CERTDIR: ''
    ports:
      - name: app
        container: 8080
        preferred: 8090
        range: [8090, 8130]
      - name: app2
        container: 8081
        preferred: 8091
        range: [8091, 8130]
    volumes:
      - name: lib
        path: /var/lib/docker
    health:
      type: exec
      cmd: [docker, info]
      timeoutSec: 180
      intervalSec: 4

guide: |
  ## Why a sandbox

  Anything you break in here — dangling images, half-built containers, a full
  disk — disappears when you stop the lab. Your real Docker installation is
  untouched.

  Two ports are published through to you: whatever you run on **8080** inside the
  sandbox appears at the **app** URL on the Services tab, and **8081** at **app2**.

  ## Step 1 - images and containers

  Open a **Shell** and try:

  ```sh
  docker version
  docker run hello-world
  docker run -d --name web -p 8080:80 nginx:alpine
  docker ps
  docker logs web
  docker exec -it web sh
  docker stop web && docker rm web
  ```

  After the third command, open the **app** URL — that is nginx running inside
  the sandbox, inside your container, on your machine.

  ## Step 2 - write a Dockerfile

  ```sh
  mkdir -p /app && cd /app

  cat > app.py <<'EOF'
  from http.server import HTTPServer, BaseHTTPRequestHandler

  class Handler(BaseHTTPRequestHandler):
      def do_GET(self):
          self.send_response(200)
          self.send_header("Content-Type", "text/html")
          self.end_headers()
          self.wfile.write(b"<h1>Built with my own Dockerfile</h1>")

  HTTPServer(("0.0.0.0", 80), Handler).serve_forever()
  EOF

  cat > Dockerfile <<'EOF'
  FROM python:3.12-alpine
  WORKDIR /app
  COPY app.py .
  EXPOSE 80
  CMD ["python", "app.py"]
  EOF

  docker build -t myapp:1.0 .
  docker images
  docker run -d -p 8080:80 --name myapp myapp:1.0
  ```

  Refresh the **app** URL.

  ## Step 3 - layers and image size

  ```sh
  docker history myapp:1.0
  docker image inspect myapp:1.0 --format '{{.Size}}'
  ```

  Add a second `RUN apk add --no-cache curl` line, rebuild, and note which layers
  were cached. This caching discussion is worth marks in the viva.

  ## Step 4 - multi-service with compose

  ```sh
  cat > docker-compose.yml <<'EOF'
  services:
    web:
      build: .
      ports:
        - "8081:80"
      depends_on:
        - cache
    cache:
      image: redis:7-alpine
  EOF

  docker compose up -d
  docker compose ps
  docker compose logs web
  docker compose down
  ```

  The **app2** URL shows the compose-managed service. Note that `web` reaches
  redis as `cache`, not `localhost` — the same DNS rule Labforge uses between labs.

  ## Step 5 - push to Docker Hub

  ```sh
  docker login
  docker tag myapp:1.0 <your-username>/myapp:1.0
  docker push <your-username>/myapp:1.0
  ```

  ## Cleaning up

  ```sh
  docker system df
  docker system prune -af
  ```
