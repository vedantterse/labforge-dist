id: jenkins
title: Jenkins CI Server
practical: Practical 3.1
module: CI/CD Automation using Jenkins & Docker
summary: A Jenkins controller that is already set up - no unlock key, no setup wizard, and every plugin the practicals need is built in.
tags: [jenkins, ci, pipeline, lo3]
version: 1.0.0
estimateMb: 1024

services:
  - id: jenkins
    name: Jenkins
    kind: web
    build:
      context: jenkins-lab
      tag: labforge/jenkins-lab:1
    description: Jenkins 2.568.2 LTS on Java 21, with 96 plugins pre-installed.
    estimateMb: 1024
    openPath: /
    ports:
      - name: web
        container: 8080
        preferred: 8080
        range: [8080, 8120]
      - name: agent
        container: 50000
        preferred: 50000
        range: [50000, 50050]
        internal: true
    volumes:
      - name: home
        path: /var/jenkins_home
    health:
      type: http
      port: web
      path: /login
      expectStatus: [200, 403]
      timeoutSec: 300
    credentials:
      - label: Login
        username: admin
        password: labforge
        secret: false
        note: Ready to use - the setup wizard and plugin download are already done.

guide: |
  ## What you get

  A Jenkins LTS controller that is **already set up**. No unlock key, no setup
  wizard, no plugin download — everything the practicals need is built into the
  image, so it works the same on every machine and does not depend on your
  network at lab time.

  Sign in with **admin** / **labforge**.

  ## Practical 3.1 — build a CI pipeline

  1. **New Item** -> name it `ci-demo` -> choose **Pipeline** -> OK.
  2. Scroll to **Pipeline**, keep *Pipeline script*, and paste:

  ```groovy
  pipeline {
      agent any
      stages {
          stage('Build') {
              steps { echo 'Compiling the application' }
          }
          stage('Test') {
              steps { echo 'Running unit tests' }
          }
          stage('Package') {
              steps { echo 'Producing the build artifact' }
          }
      }
  }
  ```

  3. **Save**, then **Build Now**. Open the run to see the stage view.

  ## Building from a Git repository

  Use **Pipeline script from SCM** and point it at a repository containing a
  `Jenkinsfile`. If you are running the Gitea lab too, the clone URL from inside
  Jenkins is `http://gitea:3000/<user>/<repo>.git` — not `localhost`, because
  inside the Jenkins container `localhost` means Jenkins itself.

  ## What the setup wizard would have done

  Worth knowing for the viva, since you did not see it:

  - Unlocked Jenkins with a key written to
    `/var/jenkins_home/secrets/initialAdminPassword`
  - Downloaded the "suggested" plugins from the Jenkins update centre
  - Asked you to create the first admin user

  All three are done for you here. You can still see the installed plugins under
  **Manage Jenkins -> Plugins -> Installed**.

  ## Troubleshooting

  - **Jobs queue but never run**: the controller has 2 executors; check
    **Build Executor Status** in the sidebar.
  - **A plugin you want is missing**: **Manage Jenkins -> Plugins -> Available**.
    This needs internet, unlike everything else in this lab.
